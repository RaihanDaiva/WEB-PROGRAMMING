<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/808ba9c7d8.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div class="output-container">
            <h2 id="output2"></h2>
            <h1 id="output"></h1>
        </div>
        <div class="button-container">
            <div class="button">
                <button id="button7" style="background-color: #2a2a2c;">7</button>
                <button id="button8" style="background-color: #2a2a2c;">8</button>
                <button id="button9" style="background-color: #2a2a2c;">9</button>
                <button id="buttonC" style="background-color: #ff9f0a;">C</button>
                <button id="button4" style="background-color: #2a2a2c;">4</button>
                <button id="button5" style="background-color: #2a2a2c;">5</button>
                <button id="button6" style="background-color: #2a2a2c;">6</button>
                <button id="button+" style="background-color: #ff9f0a;">+</button>
                <button id="button1" style="background-color: #2a2a2c;">1</button>
                <button id="button2" style="background-color: #2a2a2c;">2</button>
                <button id="button3" style="background-color: #2a2a2c;">3</button>
                <button id="button-" style="background-color: #ff9f0a;">-</button>
                <button style="background-color: #2a2a2c;"><i class="fa-solid fa-calculator"></i></button>
                <button id="button0" style="background-color: #2a2a2c;">0</button>
                <button style="background-color: #2a2a2c;">.</button>
                <button id="button=" style="background-color: #ff9f0a;">=</button>
            </div>
        </div>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
